apiVersion: apps/v1
kind: Deployment
metadata:
  name: verstapen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: verstapen
  template:
    metadata:
      labels:
        app: verstapen
    spec:
      containers:
        - name: site
          image: vtacic/site-verstapen:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80