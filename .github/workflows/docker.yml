
name: Build and deploy Verstappen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            vtacic/site-verstapen:latest
            vtacic/site-verstapen:${{ github.sha }}

      
      - name: Deploy to Kubernetes
        shell: cmd
        run: |
          kubectl config use-context docker-desktop
          if errorlevel 1 exit /b 1

          kubectl set image deployment/verstapen site=vtacic/site-verstapen:${{ github.sha }}
          if errorlevel 1 exit /b 1

          kubectl rollout status deployment/verstapen --timeout=120s
          if errorlevel 1 exit /b 1

      - name: Update local repo
        shell: cmd
        run: |
          cd /d C:\Users\user\verstapen
          git fetch origin
          git pull --ff-only origin main