
name: Build and deploy Verstappen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            vtacic/site-verstapen:latest
            vtacic/site-verstapen:${{ github.sha }}

      
      - name: Deploy website
        shell: cmd
        run: |
          docker pull vtacic/site-verstapen:latest
          if errorlevel 1 exit /b 1

          docker rm -f verstapen 2>nul

          docker run -d --name verstapen --restart unless-stopped -p 8080:80 vtacic/site-verstapen:latest
          if errorlevel 1 exit /b 1

