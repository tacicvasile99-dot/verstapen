name: Build and publish Verstappen

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lint Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint < Dockerfile

      - name: Validate Kubernetes manifests (kustomize + kubeconform)
        run: kubectl kustomize k8s/overlays/prod | docker run --rm -i ghcr.io/yannh/kubeconform:latest-alpine -strict -ignore-missing-schemas -summary -

  build-and-publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (local, not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: |
            vtacic/site-verstapen:latest
            vtacic/site-verstapen:${{ github.sha }}

      - name: Scan image (trivy, report only)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 0 vtacic/site-verstapen:${{ github.sha }}

      - name: Push image
        run: |
          docker push vtacic/site-verstapen:${{ github.sha }}
          docker push vtacic/site-verstapen:latest

      - name: Update image tag in Git (Argo CD will deploy it)
        run: |
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|" helm/verstapen/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/verstapen/values.yaml
          git commit -m "chore: deploy ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main