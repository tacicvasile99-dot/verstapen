
name: Build si push imagine Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Descarca codul
        uses: actions/checkout@v4

      - name: Login la Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configureaza Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build si push imagine
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            vtacic/site-verstapen:latest
            vtacic/site-verstapen:${{ github.sha }}
