apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: verstapen
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tacicvasile99-dot/verstapen.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true